<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1f1f" />
    <!-- Hero background is the LCP on the homepage; fetch it early. Only on "/",
         so deep links don't download (and warn about) an unused image. Kept above
         the stylesheet so this inline script doesn't wait for CSS. -->
    <script>
      if (location.pathname === "/") {
        [
          ["/images/hero-back2-1920.avif", "(min-width: 768px)"],
          ["/images/hero-back2-1280.avif", "(max-width: 767.98px)"],
        ].forEach(function (entry) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.type = "image/avif";
          link.href = entry[0];
          link.media = entry[1];
          link.fetchPriority = "high";
          document.head.appendChild(link);
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
